<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121B17"/>
      <stop offset="100%" stop-color="#0A100D"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48C498"/>
      <stop offset="100%" stop-color="#2D8667"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7E8C8"/>
      <stop offset="100%" stop-color="#38A37F"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#263C32" stroke-width="8"/>

  <!-- Glowing Core Accent -->
  <circle cx="256" cy="256" r="160" fill="#38A37F" opacity="0.15" filter="url(#glow)"/>

  <!-- Logo Geometry (Dynamic ATS Diamond & Layers) -->
  <g transform="translate(256,256) scale(12)" filter="url(#glow)">
    <path d="M0 -14 L14 -4 L0 6 L-14 -4 Z" fill="url(#mintGrad)"/>
    <path d="M-14 0 L0 10 L14 0 L14 5 L0 15 L-14 5 Z" fill="url(#accentGrad)" opacity="0.9"/>
    <path d="M-14 7 L0 17 L14 7 L14 12 L0 22 L-14 12 Z" fill="url(#mintGrad)"/>
  </g>

  <!-- Subtle Sparkle -->
  <circle cx="370" cy="140" r="12" fill="#A7E8C8"/>
</svg>
